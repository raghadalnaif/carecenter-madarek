<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدارك الطفل — نظام الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#f1f5f9;color:#1e293b;direction:rtl}
:root{--primary:#0f766e;--primary-dark:#0d6560;--primary-light:#ccfbf1;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;--info:#3b82f6}
.sidebar{width:240px;background:linear-gradient(160deg,#0f766e 0%,#065f46 100%);min-height:100vh;position:fixed;right:0;top:0;z-index:100;display:flex;flex-direction:column;transition:.3s}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.15)}
.sidebar-logo h1{color:#fff;font-size:18px;font-weight:700;line-height:1.4}
.sidebar-logo p{color:rgba(255,255,255,.6);font-size:12px;margin-top:4px}
.nav-section{padding:16px 8px}
.nav-label{color:rgba(255,255,255,.4);font-size:11px;font-weight:600;padding:0 12px;margin-bottom:6px;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;color:rgba(255,255,255,.75);cursor:pointer;border-radius:8px;margin:2px 0;transition:.2s;font-size:14px;font-weight:500}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.15);color:#fff}
.nav-item .ni{width:18px;height:18px;flex-shrink:0}
.main{margin-right:240px;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:18px;font-weight:700;color:#0f766e}
.topbar-user{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:36px;height:36px;background:#0f766e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.content{padding:24px;flex:1}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:700;color:#1e293b;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-right:4px solid transparent}
.stat-card.green{border-color:#10b981}.stat-card.blue{border-color:#3b82f6}.stat-card.yellow{border-color:#f59e0b}.stat-card.red{border-color:#ef4444}
.stat-val{font-size:28px;font-weight:900;color:#1e293b}
.stat-lbl{font-size:13px;color:#64748b;margin-top:4px}
.alert-box{border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;font-size:14px}
.alert-red{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert-yellow{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-orange{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.alert-green{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.alert-blue{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f1f5f9;color:#475569}
.badge-orange{background:#ffedd5;color:#9a3412}
.btn{padding:9px 18px;border-radius:8px;border:none;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#0f766e;color:#fff}.btn-primary:hover{background:#0d6560}
.btn-secondary{background:#f1f5f9;color:#475569}.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:#fee2e2;color:#991b1b}.btn-danger:hover{background:#fecaca}
.btn-success{background:#dcfce7;color:#166534}.btn-success:hover{background:#bbf7d0}
.btn-warning{background:#fef9c3;color:#854d0e}
.btn-wa{background:#25d366;color:#fff;font-size:13px;padding:7px 14px}.btn-wa:hover{background:#22c55e}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:11px 14px;text-align:right;font-weight:700;color:#475569;font-size:13px;border-bottom:2px solid #e2e8f0}
td{padding:11px 14px;border-bottom:1px solid #f1f5f9;font-size:14px;vertical-align:middle}
tr:hover td{background:#f8fafc}
.input{border:1.5px solid #e2e8f0;border-radius:8px;padding:9px 12px;width:100%;font-family:'Tajawal',sans-serif;font-size:14px;outline:none;transition:.2s;background:#fff;color:#1e293b}
.input:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.1)}
.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-header h2{font-size:17px;font-weight:700}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;gap:10px;justify-content:flex-start}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;line-height:1;padding:4px}
.close-btn:hover{color:#1e293b}
.tabs{display:flex;gap:2px;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:20px}
.tab{flex:1;padding:9px 12px;text-align:center;cursor:pointer;border-radius:8px;font-size:13px;font-weight:600;color:#64748b;transition:.2s}
.tab.active{background:#fff;color:#0f766e;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search-bar{position:relative;margin-bottom:16px}
.search-bar input{padding-right:36px}
.search-bar .search-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:16px}
.actions-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:#f1f5f9;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.chip.active{background:#0f766e;color:#fff}
.chip:hover:not(.active){background:#e2e8f0}
.empty-state{text-align:center;padding:48px 20px;color:#94a3b8}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px}
.progress-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:.3s}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){
  .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f766e 0%,#065f46 100%)}
.login-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:24px;font-weight:900;color:#0f766e;margin-top:12px}
.login-logo p{font-size:14px;color:#64748b;margin-top:4px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h2{font-size:16px;font-weight:700}
.attendance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.attendance-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:2px solid #e2e8f0;cursor:pointer;transition:.2s}
.attendance-card.present{border-color:#10b981;background:#f0fdf4}
.attendance-card.absent{border-color:#ef4444;background:#fef2f2}
.attendance-card.late{border-color:#f59e0b;background:#fffbeb}
.wa-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:#25d366;color:#fff;border-radius:8px;text-decoration:none;font-family:'Tajawal',sans-serif;font-weight:600;font-size:14px;transition:.2s}
.wa-btn:hover{background:#22c55e}
.page-hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>

<script>
// =========================================================
//  HELPERS
// =========================================================
const today = () => new Date().toISOString().split('T')[0];
const addDays = (date, n) => {
  const d = new Date(date + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
};
const diffDays = (d1, d2) => Math.round((new Date(d1) - new Date(d2)) / 86400000);
const formatDate = d => {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('ar-SA', {year:'numeric',month:'short',day:'numeric'});
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const T0 = today();

// =========================================================
//  SEED DATA
// =========================================================
const SEED = {
  branches: [
    {id:'b1',name:'الفرع الرئيسي',location:'حي النزهة'},
    {id:'b2',name:'الفرع الثاني',location:'حي الملقا'},
  ],
  users: [
    {id:'sa1',username:'admin',password:'admin123',role:'superadmin',name:'المدير العام',phone:''},
    {id:'u1',username:'manal',password:'123456',role:'school_admin',schoolId:'s1',name:'منال',phone:'0501234567'},
    {id:'u2',username:'rawan',password:'123456',role:'school_admin',schoolId:'s1',name:'روان',phone:'0509876543'},
    {id:'u3',username:'sarah',password:'123456',role:'teacher',schoolId:'s1',branchId:'b1',period:'morning',name:'الأستاذة سارة',phone:'0507654321'},
    {id:'u4',username:'hessa',password:'123456',role:'teacher',schoolId:'s1',branchId:'b1',period:'evening',name:'الأستاذة هيفاء',phone:'0508765432'},
    {id:'u5',username:'noura',password:'123456',role:'teacher',schoolId:'s1',branchId:'b2',period:'morning',name:'الأستاذة نورا',phone:'0506543210'},
    {id:'u6',username:'lama',password:'123456',role:'teacher',schoolId:'s1',branchId:'b2',period:'evening',name:'الأستاذة لمى',phone:'0505432109'},
  ],
  schools: [
    {id:'s1',name:'مدارك الطفل',contactPerson:'منال',phone:'0501234567',email:'madarik@center.com',isActive:true,joinDate:'2024-09-01',vatNumber:'310123456700003',address:'الرياض، المملكة العربية السعودية'},
  ],
  children: [
    {id:'c1',schoolId:'s1',branchId:'b1',teacherId:'u3',period:'morning',name:'عبدالله محمد العمري',parentName:'محمد العمري',parentPhone:'0551234567',grade:'KG1',notes:'',isActive:true,joinDate:'2024-09-01',isVip:false,discountPct:0},
    {id:'c2',schoolId:'s1',branchId:'b1',teacherId:'u4',period:'evening',name:'نورة عبدالله السالم',parentName:'عبدالله السالم',parentPhone:'0557654321',grade:'KG2',notes:'حساسية من اللاكتوز',isActive:true,joinDate:'2024-09-01',isVip:true,discountPct:10},
    {id:'c3',schoolId:'s1',branchId:'b2',teacherId:'u5',period:'morning',name:'فيصل خالد الحربي',parentName:'خالد الحربي',parentPhone:'0559876543',grade:'KG1',notes:'',isActive:true,joinDate:'2024-10-01',isVip:false,discountPct:0},
    {id:'c4',schoolId:'s1',branchId:'b2',teacherId:'u6',period:'evening',name:'ريم سعد القحطاني',parentName:'سعد القحطاني',parentPhone:'0551122334',grade:'KG2',notes:'',isActive:true,joinDate:'2024-09-15',isVip:false,discountPct:0},
    {id:'c5',schoolId:'s1',branchId:'b1',teacherId:'u3',period:'morning',name:'يوسف أحمد الزهراني',parentName:'أحمد الزهراني',parentPhone:'0554455667',grade:'KG1',notes:'',isActive:true,joinDate:'2024-11-01',isVip:true,discountPct:20},
  ],
  subscriptions: [
    {id:'sub1',childId:'c1',schoolId:'s1',branchId:'b1',period:'morning',type:'monthly',startDate:addDays(T0,-20),endDate:addDays(T0,10),basePrice:1800,discountPct:0,price:1800,paidAmount:1800,paymentStatus:'paid',isActive:true,createdAt:addDays(T0,-20),invoiceNo:'INV-0001'},
    {id:'sub2',childId:'c2',schoolId:'s1',branchId:'b1',period:'evening',type:'monthly',startDate:addDays(T0,-28),endDate:addDays(T0,2),basePrice:900,discountPct:10,price:810,paidAmount:400,paymentStatus:'partial',isActive:true,createdAt:addDays(T0,-28),invoiceNo:'INV-0002'},
    {id:'sub3',childId:'c3',schoolId:'s1',branchId:'b2',period:'morning',type:'weekly',startDate:addDays(T0,-4),endDate:addDays(T0,3),basePrice:600,discountPct:0,price:600,paidAmount:600,paymentStatus:'paid',isActive:true,createdAt:addDays(T0,-4),invoiceNo:'INV-0003'},
    {id:'sub4',childId:'c4',schoolId:'s1',branchId:'b2',period:'evening',type:'weekly',startDate:addDays(T0,-8),endDate:addDays(T0,-1),basePrice:300,discountPct:0,price:300,paidAmount:0,paymentStatus:'deferred',isActive:true,createdAt:addDays(T0,-8),invoiceNo:'INV-0004'},
    {id:'sub5',childId:'c5',schoolId:'s1',branchId:'b1',period:'morning',type:'daily',startDate:T0,endDate:T0,basePrice:150,discountPct:20,price:120,paidAmount:120,paymentStatus:'paid',isActive:true,createdAt:T0,invoiceNo:'INV-0005'},
  ],
  attendance: (() => {
    const arr = [];
    const kids = ['c1','c2','c3','c4','c5'];
    const statuses = ['present','present','present','absent','present','late','present'];
    for(let i=1;i<=7;i++){
      for(const cid of kids){
        arr.push({id:uid(),childId:cid,schoolId:'s1',date:addDays(T0,-i),status:statuses[Math.floor(Math.random()*statuses.length)],checkIn:'07:30',checkOut:'14:00',takenBy:'u2',notes:''});
      }
    }
    return arr;
  })(),
};

// =========================================================
//  DB
// =========================================================
const DB = {
  get(k){try{return JSON.parse(localStorage.getItem('ccs_'+k))}catch{return null}},
  set(k,v){localStorage.setItem('ccs_'+k,JSON.stringify(v))},
  init(){
    if(this.get('initialized')) return;
    Object.keys(SEED).forEach(k=>this.set(k,SEED[k]));
    this.set('initialized',true);
  },
  users(){return this.get('users')||[]},
  schools(){return this.get('schools')||[]},
  branches(){return this.get('branches')||SEED.branches},
  children(){return this.get('children')||[]},
  subscriptions(){return this.get('subscriptions')||[]},
  attendance(){return this.get('attendance')||[]},
  save(k,arr){this.set(k,arr)},
  addUser(u){const a=this.users();a.push(u);this.save('users',a)},
  updateUser(u){const a=this.users();const i=a.findIndex(x=>x.id===u.id);a[i]=u;this.save('users',a)},
  deleteUser(id){this.save('users',this.users().filter(x=>x.id!==id))},
  addSchool(s){const a=this.schools();a.push(s);this.save('schools',a)},
  updateSchool(s){const a=this.schools();const i=a.findIndex(x=>x.id===s.id);a[i]=s;this.save('schools',a)},
  addChild(c){const a=this.children();a.push(c);this.save('children',a)},
  updateChild(c){const a=this.children();const i=a.findIndex(x=>x.id===c.id);a[i]=c;this.save('children',a)},
  addSub(s){const a=this.subscriptions();a.push(s);this.save('subscriptions',a)},
  updateSub(s){const a=this.subscriptions();const i=a.findIndex(x=>x.id===s.id);a[i]=s;this.save('subscriptions',a)},
  saveAttendance(list){this.save('attendance',list)},
  // get active subscription for child (latest by endDate)
  activeSub(childId){
    return this.subscriptions().filter(s=>s.childId===childId&&s.isActive).sort((a,b)=>b.endDate>a.endDate?1:-1)[0]||null;
  },
  subStatus(sub){
    if(!sub) return 'none';
    const d=diffDays(sub.endDate,T0);
    if(d<0) return 'expired';
    if(d===0) return 'today';
    if(d<=3) return 'soon3';
    if(d<=7) return 'soon7';
    return 'active';
  },
  alerts(schoolId=null){
    let subs=this.subscriptions();
    if(schoolId) subs=subs.filter(s=>s.schoolId===schoolId);
    subs=subs.filter(s=>s.isActive);
    return {
      expired:subs.filter(s=>diffDays(s.endDate,T0)<0),
      today:subs.filter(s=>s.endDate===T0),
      in3:subs.filter(s=>diffDays(s.endDate,T0)>0&&diffDays(s.endDate,T0)<=3),
      in7:subs.filter(s=>diffDays(s.endDate,T0)>3&&diffDays(s.endDate,T0)<=7),
    };
  },
  childName(id){return this.children().find(c=>c.id===id)?.name||id},
  schoolName(id){return this.schools().find(s=>s.id===id)?.name||id},
  branchName(id){return this.branches().find(b=>b.id===id)?.name||'—'},
  addBranch(b){const a=this.branches();a.push(b);this.set('branches',a)},
  updateBranch(b){const a=this.branches();const i=a.findIndex(x=>x.id===b.id);a[i]=b;this.set('branches',a)},
};

// =========================================================
//  AUTH
// =========================================================
const Auth = {
  user:null,
  init(){
    const s=sessionStorage.getItem('ccs_user');
    if(s){try{this.user=JSON.parse(s)}catch{}}
  },
  login(username,password){
    const u=DB.users().find(u=>u.username===username&&u.password===password);
    if(u){this.user=u;sessionStorage.setItem('ccs_user',JSON.stringify(u));return true}
    return false;
  },
  logout(){this.user=null;sessionStorage.removeItem('ccs_user');App.go('login')},
  isSuperAdmin(){return this.user?.role==='superadmin'},
  isSchoolAdmin(){return this.user?.role==='school_admin'},
  isTeacher(){return this.user?.role==='teacher'},
  schoolId(){return this.user?.schoolId||null},
};

// =========================================================
//  APP STATE & ROUTER
// =========================================================
const App = {
  view:'dashboard',
  modal:null,
  params:{},
  go(view,params={}){this.view=view;this.params=params;this.render()},
  render(){document.getElementById('app').innerHTML=Auth.user?this.shell():Views.login()},
  shell(){
    return `
    <div style="display:flex">
      ${this.sidebar()}
      <div class="main">
        ${this.topbar()}
        <div class="content" id="content">${this.currentView()}</div>
      </div>
    </div>
    ${App.modal?App.modal:''}
    `;
  },
  sidebar(){
    const u=Auth.user;
    const links = u.role==='superadmin' ? [
      {v:'dashboard',icon:'🏠',label:'الرئيسية'},
      {v:'schools',icon:'🏫',label:'المدارس'},
      {v:'branches',icon:'🏢',label:'الفروع'},
      {v:'children',icon:'👶',label:'الأطفال'},
      {v:'subscriptions',icon:'📋',label:'الاشتراكات'},
      {v:'reports',icon:'📊',label:'التقارير'},
      {v:'users',icon:'👥',label:'المستخدمون'},
    ] : u.role==='school_admin' ? [
      {v:'dashboard',icon:'🏠',label:'الرئيسية'},
      {v:'children',icon:'👶',label:'الأطفال'},
      {v:'subscriptions',icon:'📋',label:'الاشتراكات'},
      {v:'attendance',icon:'✅',label:'الحضور'},
      {v:'reports',icon:'📊',label:'التقارير'},
      {v:'whatsapp',icon:'💬',label:'رسائل واتساب'},
    ] : [
      {v:'attendance',icon:'✅',label:'تسجيل الحضور'},
      {v:'my_reports',icon:'📊',label:'تقارير الحضور'},
    ];
    return `
    <div class="sidebar">
      <div class="sidebar-logo">
        <h1>🌟 دار الضيافة</h1>
        <p>نظام إدارة متكامل</p>
      </div>
      <div class="nav-section">
        ${links.map(l=>`<div class="nav-item ${App.view===l.v?'active':''}" onclick="App.go('${l.v}')">${l.icon} ${l.label}</div>`).join('')}
      </div>
      <div style="margin-top:auto;padding:16px 8px;border-top:1px solid rgba(255,255,255,.15)">
        <div class="nav-item" onclick="Auth.logout()">🚪 تسجيل الخروج</div>
      </div>
    </div>`;
  },

// ---------- SUBSCRIPTIONS ----------
subscriptions(){
  const sid=Auth.schoolId();
  let subs=DB.subscriptions();
  if(sid) subs=subs.filter(s=>s.schoolId===sid);
  const filter=App.params.filter||'all';
  let filtered=subs;
  if(filter==='active') filtered=subs.filter(s=>s.isActive&&diffDays(s.endDate,T0)>=0);
  if(filter==='expired') filtered=subs.filter(s=>diffDays(s.endDate,T0)<0);
  if(filter==='expiring') filtered=subs.filter(s=>s.isActive&&diffDays(s.endDate,T0)>=0&&diffDays(s.endDate,T0)<=7);
  if(filter==='unpaid') filtered=subs.filter(s=>s.paymentStatus!=='paid');
  filtered.sort((a,b)=>a.endDate>b.endDate?1:-1);
  const chips=[['all','الكل'],['active','فعالة'],['expiring','تنتهي قريباً'],['expired','منتهية'],['unpaid','غير مدفوعة']];
  return `
  <div class="actions-bar">
    ${chips.map(([v,l])=>`<span class="chip ${filter===v?'active':''}" onclick="App.go('subscriptions',{filter:'${v}'})">${l} (${v==='all'?subs.length:v==='active'?subs.filter(s=>s.isActive&&diffDays(s.endDate,T0)>=0).length:v==='expiring'?subs.filter(s=>s.isActive&&diffDays(s.endDate,T0)>=0&&diffDays(s.endDate,T0)<=7).length:v==='expired'?subs.filter(s=>diffDays(s.endDate,T0)<0).length:subs.filter(s=>s.paymentStatus!=='paid').length})</span>`).join('')}
  </div>
  <div class="card">
    <table>
      <thead><tr><th>الطفل</th><th>النوع</th><th>يبدأ</th><th>ينتهي</th><th>المبلغ</th><th>حالة الدفع</th><th>المتبقي</th><th>الحالة</th><th>إجراءات</th></tr></thead>
      <tbody>
        ${filtered.length?filtered.map(s=>{
          const child=DB.children().find(c=>c.id===s.childId);
          const st=DB.subStatus(s);
          const daysLeft=diffDays(s.endDate,T0);
          const stMap={active:'badge-green',today:'badge-yellow',soon3:'badge-orange',soon7:'badge-blue',expired:'badge-red',none:'badge-gray'};
          const stLbl={active:'نشط',today:'ينتهي اليوم',soon3:`${daysLeft} أيام`,soon7:`${daysLeft} أيام`,expired:'منتهي',none:'—'};
          const typeMap={daily:'يومي',weekly:'أسبوعي',monthly:'شهري'};
          return `<tr>
            <td><strong>${esc(child?.name||'—')}</strong>${Auth.isSuperAdmin()?`<br><small style="color:#94a3b8">${DB.schoolName(s.schoolId)}</small>`:''}</td>
            <td><span class="badge badge-blue">${typeMap[s.type]||s.type}</span></td>
            <td>${formatDate(s.startDate)}</td>
            <td>${formatDate(s.endDate)}</td>
            <td>${s.price} ر.س</td>
            <td>${Views._payBadge(s)}</td>
            <td>${s.price-s.paidAmount>0?`<span style="color:#ef4444;font-weight:700">${s.price-s.paidAmount} ر.س</span>`:'<span style="color:#10b981">✓</span>'}</td>
            <td><span class="badge ${stMap[st]}">${stLbl[st]}</span></td>
            <td style="white-space:nowrap">
              ${s.paymentStatus!=='paid'?`<button class="btn btn-success btn-xs" onclick="Modals.pay('${s.id}')">دفع</button>`:''}
              <button class="btn btn-secondary btn-xs" onclick="Modals.addSub('${s.childId}')">تجديد</button>
              ${child?`<a href="https://wa.me/966${child.parentPhone.slice(1)}?text=${encodeURIComponent(`مرحباً، اشتراك ${child.name} ينتهي ${formatDate(s.endDate)}. يرجى التجديد.`)}" target="_blank" class="btn btn-wa btn-xs">واتساب</a>`:''}
            </td>
          </tr>`;
        }).join(''):`<tr><td colspan="9"><div class="empty-state"><div class="es-icon">📋</div><p>لا توجد نتائج</p></div></td></tr>`}
      </tbody>
    </table>
  </div>`;
},

// ---------- ATTENDANCE ----------
attendance(){
  const u=Auth.user;
  const isTeacher=u.role==='teacher';
  const isAdmin=u.role==='school_admin'||u.role==='superadmin';
  const sid=Auth.schoolId()||App.params.schoolId;
  const date=App.params.date||T0;
  const allSubs=DB.subscriptions();

  const hasActiveSub=(childId)=>allSubs.some(s=>
    s.childId===childId&&s.isActive&&s.startDate<=date&&s.endDate>=date
  );

  let kids=DB.children();
  if(sid) kids=kids.filter(c=>c.schoolId===sid);

  // المعلمة: أطفالها فقط + الاشتراك فعّال — بدون أي قسم آخر
  if(isTeacher){
    kids=kids.filter(c=>c.teacherId===u.id&&hasActiveSub(c.id));
  } else {
    // الإدارة: فلترة بالمعلمة لو اختارت (غياب معلمة)
    const teacherFilter=App.params.teacherFilter||'';
    if(teacherFilter) kids=kids.filter(c=>c.teacherId===teacherFilter);
    // فلترة الفرع
    if(App.params.branchFilter) kids=kids.filter(c=>c.branchId===App.params.branchFilter);
    // الإدارة تعرف من لديه اشتراك فعّال فقط
    kids=kids.filter(c=>hasActiveSub(c.id));
  }

  const attList=DB.attendance();
  const todayAtt=attList.filter(a=>a.date===date&&(sid?a.schoolId===sid:true));
  const attMap={};
  todayAtt.forEach(a=>{attMap[a.childId]=a});
  const isToday=date===T0;

  const renderCard=(c)=>{
    const a=attMap[c.id];
    const status=a?.status||'';
    // للإدارة فقط: نعرض اسم المعلمة فوق الطفل
    const teacher=isAdmin?DB.users().find(t=>t.id===c.teacherId):null;
    return `<div class="attendance-card ${status}" id="att-${c.id}">
      <div style="font-weight:700;font-size:14px">${esc(c.name)}</div>
      <div style="font-size:11px;color:#64748b;margin-top:2px">${c.grade||''} — ${esc(c.parentName)}</div>
      ${teacher?`<div style="font-size:11px;color:#0f766e;margin-top:3px">👩‍🏫 ${esc(teacher.name)}</div>`:''}
      <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">
        <span class="badge badge-blue" style="font-size:10px">🏢 ${DB.branchName(c.branchId)}</span>
        <span class="badge ${c.period==='morning'?'badge-blue':'badge-orange'}" style="font-size:10px">${c.period==='morning'?'🌅 صباحي':'🌙 مسائي'}</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="btn btn-xs ${status==='present'?'btn-success':''}" style="flex:1;justify-content:center" onclick="setAtt('${c.id}','present','${date}','${c.schoolId}')">✅ حاضر</button>
        <button class="btn btn-xs ${status==='absent'?'btn-danger':''}" style="flex:1;justify-content:center" onclick="setAtt('${c.id}','absent','${date}','${c.schoolId}')">❌ غائب</button>
        <button class="btn btn-xs ${status==='late'?'btn-warning':''}" style="flex:1;justify-content:center" onclick="setAtt('${c.id}','late','${date}','${c.schoolId}')">⏰ متأخر</button>
      </div>
      ${a?`<div style="font-size:11px;margin-top:6px;color:#64748b">دخول: ${a.checkIn||'—'} · خروج: ${a.checkOut||'—'}</div>`:''}
    </div>`;
  };

  // قائمة المعلمات للفلترة (للإدارة فقط)
  const teachers=isAdmin?DB.users().filter(t=>t.role==='teacher'&&(!sid||t.schoolId===sid)):[];
  const teacherFilter=App.params.teacherFilter||'';
  const branchFilter=App.params.branchFilter||'';

  return `
  <div class="actions-bar" style="flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-weight:600;font-size:14px">التاريخ:</label>
      <input type="date" class="input" style="width:160px" value="${date}" onchange="App.go('attendance',{date:this.value,schoolId:'${sid||''}',branchFilter:'${branchFilter}',teacherFilter:'${teacherFilter}'})" max="${T0}">
    </div>
    ${isToday?`<button class="btn btn-primary btn-sm" onclick="saveAttendance('${date}','${sid||''}')">💾 حفظ الحضور</button>`:''}
    <div style="margin-right:auto;display:flex;gap:8px">
      <span class="badge badge-green">✅ ${Object.values(attMap).filter(a=>a.status==='present').length} حاضر</span>
      <span class="badge badge-red">❌ ${Object.values(attMap).filter(a=>a.status==='absent').length} غائب</span>
      <span class="badge badge-yellow">⏰ ${Object.values(attMap).filter(a=>a.status==='late').length} متأخر</span>
    </div>
  </div>

  ${isAdmin?`
  <div class="card" style="padding:12px;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <span style="font-size:13px;font-weight:600;color:#64748b">🏢 الفرع:</span>
      <span class="chip ${!branchFilter?'active':''}" onclick="App.go('attendance',{date:'${date}',schoolId:'${sid||''}',branchFilter:'',teacherFilter:'${teacherFilter}'})">الكل</span>
      ${DB.branches().map(b=>`<span class="chip ${branchFilter===b.id?'active':''}" onclick="App.go('attendance',{date:'${date}',schoolId:'${sid||''}',branchFilter:'${b.id}',teacherFilter:'${teacherFilter}'})">${esc(b.name)}</span>`).join('')}
    </div>
    <div style="border-top:1px solid #f1f5f9;padding-top:10px">
      <span style="font-size:13px;font-weight:600;color:#64748b">👩‍🏫 الفصل:</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        <span class="chip ${!teacherFilter?'active':''}" onclick="App.go('attendance',{date:'${date}',schoolId:'${sid||''}',branchFilter:'${branchFilter}',teacherFilter:''})">جميع الفصول</span>
        ${teachers.map(t=>`<span class="chip ${teacherFilter===t.id?'active':''}" onclick="App.go('attendance',{date:'${date}',schoolId:'${sid||''}',branchFilter:'${branchFilter}',teacherFilter:'${t.id}'})">${esc(t.name)}</span>`).join('')}
      </div>
    </div>
  </div>`:''}

  ${kids.length===0?`<div class="card"><div class="empty-state"><div class="es-icon">👶</div><p>${isTeacher?'لا يوجد أطفال نشطون في فصلك اليوم':'لا يوجد أطفال لديهم اشتراك فعّال في هذا التاريخ'}</p></div></div>`:`
  <div class="attendance-grid" id="att-grid">
    ${kids.map(c=>renderCard(c)).join('')}
  </div>`}
  `;
},

// ---------- WHATSAPP ----------
whatsapp(){
  const sid=Auth.schoolId();
  const al=DB.alerts(sid);
  const children=DB.children();
  const subs=DB.subscriptions();
  const buildMsg=(sub,days)=>{
    const c=children.find(x=>x.id===sub.childId);
    if(!c) return null;
    const msgs={
      expired:`السلام عليكم 🌟\nنود إشعاركم بأن اشتراك الطفل ${c.name} في دار الضيافة قد انتهى بتاريخ ${formatDate(sub.endDate)}.\nيسعدنا التواصل معكم لتجديد الاشتراك.\nشكراً لثقتكم 🌺`,
      today:`السلام عليكم 🌟\nتذكير ودي: اشتراك ${c.name} ينتهي اليوم.\nلتجديد الاشتراك تواصلوا معنا.\nشكراً 🌺`,
      soon:`السلام عليكم 🌟\nتذكير: اشتراك ${c.name} سينتهي بتاريخ ${formatDate(sub.endDate)} (خلال ${days} أيام).\nيسعدنا خدمتكم لتجديد الاشتراك.\nشكراً 🌺`,
    };
    const msgKey=days===0?'today':days<0?'expired':'soon';
    const phone='966'+c.parentPhone.slice(1);
    return {child:c,sub,msg:msgs[msgKey],phone};
  };
  const renderGroup=(list,label,days)=>{
    const items=list.map(s=>buildMsg(s,days)).filter(Boolean);
    if(!items.length) return '';
    return `
    <div class="card">
      <div class="card-title">${label} (${items.length})</div>
      ${items.map(({child,sub,msg,phone})=>`
      <div style="border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:16px">
        <div style="flex:1">
          <div style="font-weight:700;margin-bottom:4px">${esc(child.name)}</div>
          <div style="font-size:13px;color:#64748b;margin-bottom:8px">📱 ${child.parentPhone} — ينتهي: ${formatDate(sub.endDate)}</div>
          <div style="background:#f8fafc;border-radius:8px;padding:10px;font-size:13px;color:#374151;line-height:1.7;white-space:pre-wrap">${esc(msg)}</div>

// ---------- MY REPORTS (Teacher) ----------
myReports(){
  const u=Auth.user;
  const sid=Auth.schoolId();
  // أطفال المعلمة فقط
  const kids=DB.children().filter(c=>c.schoolId===sid&&c.teacherId===u.id);
  const attList=DB.attendance().filter(a=>a.schoolId===sid);
  const allSubs=DB.subscriptions();
  return `
  <div class="card">
    <div class="card-title">📊 تقرير حضور أطفالي (${kids.length} طفل)</div>
    ${kids.length===0?`<div class="empty-state"><div class="es-icon">👶</div><p>لا يوجد أطفال مسندون إليك حتى الآن</p></div>`:`
    <table>
      <thead><tr><th>الطفل</th><th>الفرع / الفترة</th><th>حالة الاشتراك</th><th>حضور</th><th>غياب</th><th>تأخر</th><th>نسبة</th></tr></thead>
      <tbody>
        ${kids.map(c=>{
          const cAtt=attList.filter(a=>a.childId===c.id);
          const present=cAtt.filter(a=>a.status==='present').length;
          const absent=cAtt.filter(a=>a.status==='absent').length;
          const late=cAtt.filter(a=>a.status==='late').length;
          const total=cAtt.length||1;
          const pct=Math.round((present+late)/total*100);
          const activeSub=allSubs.find(s=>s.childId===c.id&&s.isActive&&s.startDate<=T0&&s.endDate>=T0);
          const subStatus=activeSub?`<span class="badge badge-green" style="font-size:11px">✅ حتى ${formatDate(activeSub.endDate)}</span>`:`<span class="badge badge-red" style="font-size:11px">⛔ منتهي</span>`;
          return `<tr>
            <td><strong>${esc(c.name)}</strong><br><small style="color:#94a3b8">${esc(c.parentName)}</small></td>
            <td>
              <span class="badge badge-blue" style="font-size:10px">🏢 ${DB.branchName(c.branchId)}</span><br>
              <span class="badge ${c.period==='morning'?'badge-blue':'badge-orange'}" style="font-size:10px;margin-top:3px">${c.period==='morning'?'🌅 صباحي':'🌙 مسائي'}</span>
            </td>
            <td>${subStatus}</td>
            <td style="color:#10b981;font-weight:700">${present}</td>
            <td style="color:#ef4444;font-weight:700">${absent}</td>
            <td style="color:#f59e0b;font-weight:700">${late}</td>
            <td>
              <div style="display:flex;align-items:center;gap:6px">
                <div class="progress-bar" style="width:60px"><div class="progress-fill" style="width:${pct}%;background:${pct>80?'#10b981':pct>60?'#f59e0b':'#ef4444'}"></div></div>
                <span style="font-size:12px;font-weight:700">${pct}%</span>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  </div>`;
},

function doLogin(){
  const user=document.getElementById('l-user')?.value?.trim();
  const pass=document.getElementById('l-pass')?.value?.trim();
  if(Auth.login(user,pass)){App.go('dashboard')}
  else{const e=document.getElementById('login-err');if(e)e.style.display='flex'}
}

const SUB_PRICES={morning:{daily:150,weekly:600,monthly:1800},evening:{daily:70,weekly:300,monthly:900}};

function calcEndDate(){
  const type=document.getElementById('sub-type')?.value;
  const start=document.getElementById('sub-start')?.value;
  const end=document.getElementById('sub-end');
  const period=document.getElementById('sub-period')?.value||'evening';
  if(!type||!start||!end) return;
  if(type==='daily') end.value=start;
  else if(type==='weekly') end.value=addDays(start,7);
  else if(type==='monthly') end.value=addDays(start,30);
  const priceEl=document.getElementById('sub-price');
  const paidEl=document.getElementById('sub-paid');
  const baseLabel=document.getElementById('sub-base-label');
  const base=(SUB_PRICES[period]||SUB_PRICES.evening)[type]||0;
  const disc=parseFloat(document.getElementById('sub-disc')?.value||0);
  const final=disc>0?Math.round(base*(1-disc/100)):base;
  if(baseLabel) baseLabel.textContent=base+' ر.س';
  if(priceEl){priceEl.value=final;if(paidEl)paidEl.value=final;}
}

function calcChildSubPrice(){
  const type=document.getElementById('c-sub-type')?.value;
  const start=document.getElementById('c-sub-start')?.value;
  const period=document.getElementById('c-period')?.value||'evening';
  const endEl=document.getElementById('c-sub-end');
  if(type&&start&&endEl){
    if(type==='daily') endEl.value=start;
    else if(type==='weekly') endEl.value=addDays(start,7);
    else endEl.value=addDays(start,30);
  }
  const priceEl=document.getElementById('c-sub-price');
  const paidEl=document.getElementById('c-sub-paid');
  const hintEl=document.getElementById('c-base-hint');
  if(priceEl&&type){
    const base=(SUB_PRICES[period]||SUB_PRICES.evening)[type]||0;
    const disc=parseFloat(document.getElementById('c-disc')?.value||0);
    const final=disc>0?Math.round(base*(1-disc/100)):base;
    if(hintEl) hintEl.textContent=disc>0?`أصل: ${base} ر.س`:'';
    priceEl.value=final;
    if(paidEl) paidEl.value=final;
  }
}

function syncPaidAmount(srcId,tgtId){
  const src=document.getElementById(srcId);
  const tgt=document.getElementById(tgtId);
  if(src&&tgt) tgt.value=src.value;
}

function refreshTeachers(){
  const branchId=document.getElementById('c-branch')?.value||'';
  const period=document.getElementById('c-period')?.value||'';
  const sel=document.getElementById('c-teacher');
  if(!sel) return;
  const sid=Auth.schoolId();
  const teachers=DB.users().filter(u=>
    u.role==='teacher'&&
    (!sid||u.schoolId===sid)&&
    (!branchId||u.branchId===branchId)&&
    (!period||u.period===period)
  );
  sel.innerHTML=`<option value="">— اختر المعلمة —</option>`+
    teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
}

function toggleSchoolField(){
  const role=document.getElementById('u-role')?.value;
  const sf=document.getElementById('school-field');
  if(sf) sf.style.display=role==='superadmin'?'none':'';
}

function saveBranch(edit=false){

    id:edit?document.getElementById('br-id')?.value:uid(),

    location:document.getElementById('br-loc')?.value?.trim()||'',
  };

  App.closeModal();
  App.go('branches');
}

function saveSchool(edit=false){
  const name=document.getElementById('sc-name')?.value?.trim();
  if(!name){alert('اسم المدرسة مطلوب');return}
  const s={
    id:edit?document.getElementById('sc-id')?.value:uid(),
    name,
    contactPerson:document.getElementById('sc-contact')?.value?.trim()||'',
    phone:document.getElementById('sc-phone')?.value?.trim()||'',
    email:document.getElementById('sc-email')?.value?.trim()||'',
    joinDate:document.getElementById('sc-date')?.value||T0,
    isActive:true,
  };
  if(edit) DB.updateSchool(s); else DB.addSchool(s);

function toggleSchool(id){
  const s=DB.schools().find(x=>x.id===id);
  if(!s) return;
  s.isActive=!s.isActive;
  DB.updateSchool(s);
  App.go('schools');
}

function saveChild(edit=false){
  const name=document.getElementById('c-name')?.value?.trim();
  const parent=document.getElementById('c-parent')?.value?.trim();
  const phone=document.getElementById('c-phone')?.value?.trim();
  const schoolId=document.getElementById('c-school')?.value?.trim();
  if(!name||!parent||!phone){alert('يرجى ملء الحقول المطلوبة');return}
  const childId=edit?document.getElementById('c-id')?.value:uid();
  const period=document.getElementById('c-period')?.value||'evening';
  const c={
    id:childId,
    schoolId,
    branchId:document.getElementById('c-branch')?.value||'',
    period,
    teacherId:document.getElementById('c-teacher')?.value||'',
    name,
    parentName:parent,
    parentPhone:phone,
    grade:document.getElementById('c-grade')?.value?.trim()||'',
    notes:document.getElementById('c-notes')?.value?.trim()||'',
    joinDate:document.getElementById('c-join')?.value||T0,
    isActive:true,
    isVip:document.getElementById('c-vip')?.checked||false,
    discountPct:parseFloat(document.getElementById('c-disc')?.value||0),
  };
  if(edit) DB.updateChild(c); else DB.addChild(c);

  // حفظ الاشتراك مع الطفل (للتسجيل الجديد فقط)
  if(!edit){
    const subType=document.getElementById('c-sub-type')?.value;
    const subStart=document.getElementById('c-sub-start')?.value||T0;
    const subPrice=parseFloat(document.getElementById('c-sub-price')?.value||0);
    const subPaid=parseFloat(document.getElementById('c-sub-paid')?.value||0);
    const subPay=document.getElementById('c-sub-pay')?.value||'paid';
    if(subType&&subPrice>0){
      const subEnd=subType==='daily'?subStart:subType==='weekly'?addDays(subStart,7):addDays(subStart,30);
      const allSubs=DB.subscriptions();
      const maxNum=allSubs.reduce((m,s)=>{const n=parseInt(s.invoiceNo?.replace('INV-','')||0);return n>m?n:m;},0);
      const invoiceNo='INV-'+(maxNum+1).toString().padStart(4,'0');
      const basePrice=(SUB_PRICES[period]||SUB_PRICES.evening)[subType]||subPrice;
      DB.addSub({id:uid(),childId,schoolId,branchId:c.branchId,period,type:subType,startDate:subStart,endDate:subEnd,basePrice,discountPct:0,price:subPrice,paidAmount:subPaid,paymentStatus:subPay,isActive:true,createdAt:T0,invoiceNo});
    }
  }
  App.closeModal();
  App.go('children');
}

function saveSub(){
  const childId=document.getElementById('sub-child')?.value;
  const schoolId=document.getElementById('sub-school')?.value;
  const period=document.getElementById('sub-period')?.value||'evening';
  const type=document.getElementById('sub-type')?.value;
  const startDate=document.getElementById('sub-start')?.value;
  const endDate=document.getElementById('sub-end')?.value;
  const price=parseFloat(document.getElementById('sub-price')?.value||0);
  const paidAmount=parseFloat(document.getElementById('sub-paid')?.value||0);
  const paymentStatus=document.getElementById('sub-pay')?.value;
  if(!childId||!type||!startDate||!endDate||!price){alert('يرجى ملء جميع الحقول');return}
  const child=DB.children().find(c=>c.id===childId);
  const allSubs=DB.subscriptions();
  const maxNum=allSubs.reduce((m,s)=>{const n=parseInt(s.invoiceNo?.replace('INV-','')||0);return n>m?n:m;},0);
  const invoiceNo='INV-'+(maxNum+1).toString().padStart(4,'0');
  const discPct=parseFloat(document.getElementById('sub-disc')?.value||0);
  const basePrice=(SUB_PRICES[period]||SUB_PRICES.evening)[type]||price;
  const s={id:uid(),childId,schoolId,branchId:child?.branchId||'',period,type,startDate,endDate,basePrice,discountPct:discPct,price,paidAmount,paymentStatus,isActive:true,createdAt:T0,invoiceNo};
  DB.addSub(s);
  App.closeModal();
  App.go('subscriptions');
}

function savePay(){
  const subId=document.getElementById('pay-sub')?.value;
  const amount=parseFloat(document.getElementById('pay-amount')?.value||0);
  const status=document.getElementById('pay-status')?.value;
  const sub=DB.subscriptions().find(s=>s.id===subId);
  if(!sub||amount<=0){alert('يرجى إدخال مبلغ صحيح');return}
  sub.paidAmount=Math.min(sub.price,sub.paidAmount+amount);
  sub.paymentStatus=sub.paidAmount>=sub.price?'paid':status;
  DB.updateSub(sub);
  App.closeModal();
  App.go('subscriptions');
}

function saveUser(edit=false){
  const name=document.getElementById('u-name')?.value?.trim();
  const username=document.getElementById('u-username')?.value?.trim();
  const pass=document.getElementById('u-pass')?.value?.trim();
  const role=document.getElementById('u-role')?.value;
  const schoolId=role!=='superadmin'?document.getElementById('u-school')?.value:'';
  const phone=document.getElementById('u-phone')?.value?.trim()||'';
  if(!name||!username){alert('الاسم واسم المستخدم مطلوبان');return}
  if(!edit&&!pass){alert('كلمة المرور مطلوبة');return}
  if(edit){
    const u=DB.users().find(x=>x.id===document.getElementById('u-id')?.value);
    if(!u) return;
    u.name=name;u.username=username;u.role=role;u.schoolId=schoolId;u.phone=phone;
    if(pass) u.password=pass;
    DB.updateUser(u);
  } else {
    if(DB.users().find(x=>x.username===username)){alert('اسم المستخدم مستخدم مسبقاً');return}
    DB.addUser({id:uid(),name,username,password:pass,role,schoolId,phone});
  }
  App.closeModal();
  App.go('users');
}

function deleteUser(id){
  if(!confirm('هل أنت متأكد من حذف هذا المستخدم؟')) return;
  DB.deleteUser(id);
  App.go('users');
}

// Attendance
const pendingAtt={};
function setAtt(childId,status,date,schoolId){
  if(!pendingAtt[date]) pendingAtt[date]={};
  pendingAtt[date][childId]={childId,status,date,schoolId,checkIn:'07:30',checkOut:'14:00',takenBy:Auth.user.id,notes:''};
  // Update UI immediately
  const card=document.getElementById('att-'+childId);
  if(card){
    card.className='attendance-card '+status;
    card.querySelectorAll('button').forEach((b,i)=>{
      const statuses=['present','absent','late'];
      b.className='btn btn-xs'+(b.style.flex?' '+['btn-success','btn-danger','btn-warning'][i]:'')+' '+(status===statuses[i]?['btn-success','btn-danger','btn-warning'][i]:'');
      b.className=`btn btn-xs ${status===statuses[i]?['btn-success','btn-danger','btn-warning'][i]:''}`;
    });
  }
}

function saveAttendance(date,schoolId){
  const att=DB.attendance();
  const entries=pendingAtt[date]||{};
  Object.values(entries).forEach(entry=>{
    const idx=att.findIndex(a=>a.childId===entry.childId&&a.date===date);
    if(idx>=0) att[idx]={...att[idx],...entry};
    else att.push({id:uid(),...entry});
  });
  DB.saveAttendance(att);
  alert('✅ تم حفظ الحضور بنجاح');
}
