<div id="app"></div>

<script>
// =========================================================
//  HELPERS
// =========================================================
const today = () => new Date().toISOString().split('T')[0];
const addDays = (date, n) => {
  const d = new Date(date + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
};
const diffDays = (d1, d2) => Math.round((new Date(d1) - new Date(d2)) / 86400000);
const formatDate = d => {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()}`;
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const T0 = today();

// =========================================================
//  SEED DATA
// =========================================================
const SEED = {
  branches: [
    {id:'b1',name:'الفرع الرئيسي',location:'حي الروابي'},
    {id:'b2',name:'الفرع الثاني',location:'حي الروابي'},
  ],
  users: [
    {id:'sa1',username:'admin',password:'admin123',role:'superadmin',name:'المدير العام',phone:''},
    {id:'u1',username:'main',password:'123456',role:'school_admin',schoolId:'s1',branchId:'b1',name:'ادارة الفرع الرئيسي',phone:'0501234567'},
    {id:'u2',username:'second',password:'123456',role:'school_admin',schoolId:'s1',branchId:'b2',name:'ادارة الفرع الثاني',phone:'0509876543'},
    {id:'u3',username:'sarah',password:'123456',role:'teacher',schoolId:'s1',branchId:'b1',period:'morning',name:'الأستاذة سارة',phone:'0507654321'},
    {id:'u4',username:'hessa',password:'123456',role:'teacher',schoolId:'s1',branchId:'b1',period:'evening',name:'الأستاذة هيفاء',phone:'0508765432'},
    {id:'u5',username:'noura',password:'123456',role:'teacher',schoolId:'s1',branchId:'b2',period:'morning',name:'الأستاذة نورا',phone:'0506543210'},
    {id:'u6',username:'lama',password:'123456',role:'teacher',schoolId:'s1',branchId:'b2',period:'evening',name:'الأستاذة لمى',phone:'0505432109'},
  ],
  schools: [
    {id:'s1',name:'مدارك الطفل',contactPerson:'ادارة الفرع الرئيسي',phone:'0501234567',email:'madarik@center.com',isActive:true,joinDate:'2024-09-01',vatNumber:'310123456700003',address:'الرياض، المملكة العربية السعودية'},
  ],
  children: [],
  subscriptions: [],
  attendance: [],
  notifications: [],
};

// =========================================================
//  FIREBASE
// =========================================================
const firebaseConfig={
  apiKey:'AIzaSyBEjf1Xrz-YbRHt92ifjeedmbudFy14VJ4',
  authDomain:'madarkkids.firebaseapp.com',
  databaseURL:'https://madarkkids-default-rtdb.firebaseio.com',
  projectId:'madarkkids',
  storageBucket:'madarkkids.firebasestorage.app',
  messagingSenderId:'621052089307',
  appId:'1:621052089307:web:bf5d23b9b54ec40cf38dfe'
};
let _fdb=null;
let _lastWrite=0;
const _mem={};

// =========================================================
//  DB
// =========================================================
const DB = {
  get(k){
    if(_mem.hasOwnProperty(k)) return _mem[k];
    try{return JSON.parse(localStorage.getItem('ccs_'+k))}catch{return null}
  },
  set(k,v){
    _mem[k]=v;
    try{localStorage.setItem('ccs_'+k,JSON.stringify(v))}catch{}
    if(_fdb){_lastWrite=Date.now();_fdb.ref('ccs/'+k).set(v).catch(()=>{});}
  },
  async initFirebase(){
    try{
      if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      await firebase.auth().signInAnonymously();
      _fdb=firebase.database();
      // تحميل البيانات من RTDB
      const snap=await _fdb.ref('ccs').get();
      const fbData=snap.val();
      if(fbData&&Object.keys(fbData).length){
        Object.assign(_mem,fbData);
      } else {
        // نقل بيانات localStorage إلى Firebase (مرة واحدة)
        const keys=Object.keys(SEED);
        const toMigrate={};
        keys.forEach(k=>{
          const raw=localStorage.getItem('ccs_'+k);
          if(raw){try{toMigrate[k]=JSON.parse(raw);_mem[k]=toMigrate[k];}catch{}}
        });
        if(Object.keys(toMigrate).length) await _fdb.ref('ccs').set(toMigrate);
      }
      // مستمع التحديثات الفورية
      _fdb.ref('ccs').on('value',snap=>{
        if(Date.now()-_lastWrite<3000) return;
        const d=snap.val();
        if(!d) return;
        let changed=false;
        Object.keys(d).forEach(k=>{
          if(JSON.stringify(_mem[k])!==JSON.stringify(d[k])){_mem[k]=d[k];changed=true;}
        });
        if(changed&&Auth.user){
          // تحديث Auth.user إن تغيّرت بياناته (الدور أو الفرع أو كلمة المرور)
          if(Auth.user.id){
            const fresh=DB.users().find(u=>u.id===Auth.user.id);
            if(fresh){Auth.user=fresh;sessionStorage.setItem('ccs_user',JSON.stringify(fresh));}
          }
          if(!App.modal){
            const el=document.getElementById('content');
            if(!el) return;
            // حفظ قيم حقول البحث/الفلترة قبل إعادة الرسم وإعادتها بعده
            const saved={};
            el.querySelectorAll('input[id],select[id]').forEach(inp=>{saved[inp.id]=inp.value;});
            el.innerHTML=App.currentView();
            Object.entries(saved).forEach(([id,val])=>{const f=document.getElementById(id);if(f&&f.value===''&&val)f.value=val;});
          }
        }
      });
    }catch(e){console.warn('Firebase:',e);}
  },
  init(){
    // يضيف المفاتيح الناقصة في كتابة Firebase واحدة بدل N كتابة
    const missing={};
    Object.keys(SEED).forEach(k=>{
      if(this.get(k)===null){
        _mem[k]=SEED[k];
        try{localStorage.setItem('ccs_'+k,JSON.stringify(SEED[k]));}catch{}
        missing[k]=SEED[k];
      }
    });
    if(_fdb&&Object.keys(missing).length){
      _lastWrite=Date.now();
      _fdb.ref('ccs').update(missing).catch(()=>{});
    }
  },
  users(){return this.get('users')||[]},
  schools(){return this.get('schools')||[]},
  branches(){return this.get('branches')||SEED.branches},
  children(){return this.get('children')||[]},
  subscriptions(){return this.get('subscriptions')||[]},
  attendance(){return this.get('attendance')||[]},
  save(k,arr){this.set(k,arr)},
  addUser(u){const a=this.users();a.push(u);this.save('users',a)},
  updateUser(u){const a=this.users();const i=a.findIndex(x=>x.id===u.id);a[i]=u;this.save('users',a)},
  deleteUser(id){this.save('users',this.users().filter(x=>x.id!==id))},
  addSchool(s){const a=this.schools();a.push(s);this.save('schools',a)},
  updateSchool(s){const a=this.schools();const i=a.findIndex(x=>x.id===s.id);a[i]=s;this.save('schools',a)},
  addChild(c){const a=this.children();a.push(c);this.save('children',a)},
  updateChild(c){const a=this.children();const i=a.findIndex(x=>x.id===c.id);a[i]=c;this.save('children',a)},
  addSub(s){const a=this.subscriptions();a.push(s);this.save('subscriptions',a)},
  updateSub(s){const a=this.subscriptions();const i=a.findIndex(x=>x.id===s.id);a[i]=s;this.save('subscriptions',a)},
  saveAttendance(list){this.save('attendance',list)},
  notifications(){return this.get('notifications')||[]},
  addNotification(n){
    const a=this.notifications();
    a.unshift({...n,id:uid(),createdAt:new Date().toISOString(),isRead:false});
    if(a.length>50) a.splice(50);
    this.save('notifications',a);
  },
  markNotifsRead(){this.save('notifications',this.notifications().map(n=>({...n,isRead:true})));},
  unreadCount(){return this.notifications().filter(n=>!n.isRead).length;},
  // get active subscription for child (latest by endDate)
  activeSub(childId){
    return this.subscriptions().filter(s=>s.childId===childId&&s.isActive).sort((a,b)=>b.endDate>a.endDate?1:-1)[0]||null;
  },
  subStatus(sub){
    if(!sub) return 'none';
    const d=diffDays(sub.endDate,T0);
    if(d<0) return 'expired';
    if(d===0) return 'today';
    if(d<=3) return 'soon3';
    if(d<=7) return 'soon7';
    return 'active';
  },
  alerts(schoolId=null,branchId=null){
    let subs=this.subscriptions();
    if(schoolId) subs=subs.filter(s=>s.schoolId===schoolId);
    if(branchId) subs=subs.filter(s=>s.branchId===branchId);
    subs=subs.filter(s=>s.isActive);
    return {
      expired:subs.filter(s=>diffDays(s.endDate,T0)<0),
      today:subs.filter(s=>s.endDate===T0),
      in3:subs.filter(s=>diffDays(s.endDate,T0)>0&&diffDays(s.endDate,T0)<=3),
      in7:subs.filter(s=>diffDays(s.endDate,T0)>3&&diffDays(s.endDate,T0)<=7),
    };
  },
  childName(id){return this.children().find(c=>c.id===id)?.name||id},
  schoolName(id){return this.schools().find(s=>s.id===id)?.name||id},
  branchName(id){return this.branches().find(b=>b.id===id)?.name||'—'},
  addBranch(b){const a=this.branches();a.push(b);this.set('branches',a)},
  updateBranch(b){const a=this.branches();const i=a.findIndex(x=>x.id===b.id);a[i]=b;this.set('branches',a)},
};

// ---------- SUBSCRIPTIONS ----------
subscriptions(){
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  let subs=DB.subscriptions();
  if(sid) subs=subs.filter(s=>s.schoolId===sid);
  if(bid) subs=subs.filter(s=>s.branchId===bid);
  const filter=App.params.filter||'all';
  const subQ=(App.params.subQ||'').trim();
  const allChildren=DB.children();
  let filtered=subs;
  if(filter==='active') filtered=subs.filter(s=>s.isActive&&diffDays(s.endDate,T0)>=0);
  if(filter==='expired') filtered=subs.filter(s=>diffDays(s.endDate,T0)<0);
  if(filter==='expiring') filtered=subs.filter(s=>s.isActive&&diffDays(s.endDate,T0)>=0&&diffDays(s.endDate,T0)<=7);
  if(filter==='unpaid') filtered=subs.filter(s=>s.paymentStatus!=='paid');
  if(subQ) filtered=filtered.filter(s=>{const c=allChildren.find(x=>x.id===s.childId);return c&&c.name.includes(subQ)});
  filtered.sort((a,b)=>a.endDate>b.endDate?1:-1);
  const chips=[['all','الكل'],['active','فعالة'],['expiring','تنتهي قريباً'],['expired','منتهية'],['unpaid','غير مدفوعة']];
  // ملخص مالي للطالب المبحوث
  let studentSummary='';
  if(subQ&&filtered.length){
    const totalBilled=filtered.reduce((a,s)=>a+s.price,0);
    const totalPaid=filtered.reduce((a,s)=>a+s.paidAmount,0);
    const totalDue=totalBilled-totalPaid;
    studentSummary=`<div class="alert-box alert-blue" style="margin-bottom:14px">
      📊 <div style="display:flex;gap:24px;flex-wrap:wrap">
        <span>نتائج: <strong>${filtered.length}</strong> اشتراك</span>
        <span>إجمالي الفواتير: <strong>${totalBilled} ر.س</strong></span>
        <span style="color:#10b981">المدفوع: <strong>${totalPaid} ر.س</strong></span>
        <span style="color:${totalDue>0?'#ef4444':'#10b981'}">المتبقي: <strong>${totalDue} ر.س</strong></span>
      </div>
    </div>`;
  }
  return `
  <div class="actions-bar" style="gap:10px;align-items:center">
    <div class="search-bar" style="position:relative;flex:1;max-width:280px;margin:0">
      <span class="search-icon">🔍</span>
      <input class="input" style="padding-right:34px" placeholder="بحث باسم الطالب..." value="${esc(subQ)}"
        oninput="App.go('subscriptions',{filter:'${filter}',subQ:this.value})">
    </div>
    ${chips.map(([v,l])=>`<span class="chip ${filter===v?'active':''}" onclick="App.go('subscriptions',{filter:'${v}',subQ:'${esc(subQ)}'})">${l}</span>`).join('')}
  </div>
  ${studentSummary}
  <div class="card">
    <table>
      <thead><tr><th>الطفل</th><th>النوع</th><th>يبدأ</th><th>ينتهي</th><th>المبلغ</th><th>طريقة الدفع</th><th>حالة الدفع</th><th>الحالة</th><th>إجراءات</th></tr></thead>
      <tbody>
        ${filtered.length?filtered.map(s=>{
          const child=DB.children().find(c=>c.id===s.childId);
          const st=DB.subStatus(s);
          const daysLeft=diffDays(s.endDate,T0);
          const stMap={active:'badge-green',today:'badge-yellow',soon3:'badge-orange',soon7:'badge-blue',expired:'badge-red',none:'badge-gray'};
          const stLbl={active:'نشط',today:'ينتهي اليوم',soon3:`${daysLeft} أيام`,soon7:`${daysLeft} أيام`,expired:'منتهي',none:'—'};
          const typeMap={daily:'يومي',weekly:'أسبوعي',monthly:'شهري'};
          const pmLabel={cash:'💵 كاش',mada:'💳 مدى',transfer:'🏦 حوالة'}[s.paymentMethod]||'—';
          return `<tr>
            <td>
              <strong>${esc(child?.name||'—')}</strong>
              ${s.discountPct>0?`<br><small style="color:#d97706">خصم ${s.discountPct}% · أصل ${s.basePrice} ر.س</small>`:''}
              ${Auth.isSuperAdmin()?`<br><small style="color:#94a3b8">${DB.schoolName(s.schoolId)}</small>`:''}
            </td>
            <td><span class="badge badge-blue">${typeMap[s.type]||s.type}</span></td>
            <td>${formatDate(s.startDate)}</td>
            <td>${formatDate(s.endDate)}</td>
            <td><strong>${s.price} ر.س</strong>${s.price-s.paidAmount>0?`<br><small style="color:#ef4444">متبقي ${s.price-s.paidAmount}</small>`:''}</td>
            <td><span style="font-size:13px">${pmLabel}</span>${s.receiptImage?`<br><button class="btn btn-secondary btn-xs" style="margin-top:4px" onclick="Modals.viewReceipt('${s.id}')">🖼 إيصال</button>`:''}</td>
            <td>${Views._payBadge(s)}</td>
            <td><span class="badge ${stMap[st]}">${stLbl[st]}</span></td>

              ${s.paymentStatus!=='paid'?`<button class="btn btn-success btn-xs" onclick="Modals.pay('${s.id}')">دفع</button>`:''}

              ${child?`<a href="https://wa.me/966${child.parentPhone.slice(1)}?text=${encodeURIComponent(`مرحباً، اشتراك ${child.name} ينتهي ${formatDate(s.endDate)}. يرجى التجديد.`)}" target="_blank" class="btn btn-wa btn-xs">واتساب</a>`:''}

      </tbody>
    </table>
  </div>`;
},

// ---------- ATTENDANCE ----------
attendance(){
  const u=Auth.user;
  const isTeacher=u.role==='teacher';
  const isAdmin=u.role==='school_admin'||u.role==='superadmin';
  const sid=Auth.schoolId()||App.params.schoolId;
  const date=App.params.date||T0;
  const allSubs=DB.subscriptions();

  const hasActiveSub=(childId)=>allSubs.some(s=>
    s.childId===childId&&s.isActive&&s.startDate<=date&&s.endDate>=date
  );

  let kids=DB.children();
  if(sid) kids=kids.filter(c=>c.schoolId===sid);

  // المعلمة: جميع أطفال فرعها ونفس فترتها (بدون شرط اشتراك)
  if(isTeacher){
    kids=kids.filter(c=>c.branchId===u.branchId&&c.period===u.period);
  } else {
    const bid=Auth.branchId();
    if(bid){
      // مديرة الفرع: فقط أطفال فرعها (صباح ومساء)
      kids=kids.filter(c=>c.branchId===bid);
    } else {
      // المدير العام: فلترة بالفرع / فلترة بالمعلمة
      const teacherFilter=App.params.teacherFilter||'';
      if(teacherFilter){
        const tf=DB.users().find(t=>t.id===teacherFilter);
        if(tf) kids=kids.filter(c=>c.branchId===tf.branchId&&c.period===tf.period);
      }
      if(App.params.branchFilter) kids=kids.filter(c=>c.branchId===App.params.branchFilter);
    }
  }

  const attList=DB.attendance();
  const todayAtt=attList.filter(a=>a.date===date&&(sid?a.schoolId===sid:true));
  const attMap={};
  todayAtt.forEach(a=>{attMap[a.childId]=a});
  const isToday=date===T0;

  const renderCard=(c)=>{
    const a=attMap[c.id];
    const status=a?.status||'';
    const teacher=isAdmin?DB.users().find(t=>t.id===c.teacherId):null;
    const noSub=!hasActiveSub(c.id);
    return `<div class="attendance-card ${status}" id="att-${c.id}" style="${noSub?'opacity:0.78;border:1px dashed #fbbf24;':''}">
      <div style="font-weight:700;font-size:14px">${esc(c.name)}</div>
      <div style="font-size:11px;color:#64748b;margin-top:2px">${c.grade||''} — ${esc(c.parentName)}</div>
      ${teacher?`<div style="font-size:11px;color:#0f766e;margin-top:3px">👩‍🏫 ${esc(teacher.name)}</div>`:''}
      <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">
        <span class="badge badge-blue" style="font-size:10px">🏢 ${DB.branchName(c.branchId)}</span>
        <span class="badge ${c.period==='morning'?'badge-blue':'badge-orange'}" style="font-size:10px">${c.period==='morning'?'🌅 صباحي':'🌙 مسائي'}</span>
        ${noSub?`<span class="badge badge-yellow" style="font-size:10px">⚠️ بدون اشتراك</span>`:''}
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="btn btn-xs ${status==='present'?'btn-success':''}" style="flex:1;justify-content:center" onclick="setAtt('${c.id}','present','${date}','${c.schoolId}')">✅ حاضر</button>
        <button class="btn btn-xs ${status==='absent'?'btn-danger':''}" style="flex:1;justify-content:center" onclick="setAtt('${c.id}','absent','${date}','${c.schoolId}')">❌ غائب</button>
        <button class="btn btn-xs ${status==='late'?'btn-warning':''}" style="flex:1;justify-content:center" onclick="setAtt('${c.id}','late','${date}','${c.schoolId}')">⏰ متأخر</button>
      </div>
      ${a?`<div style="font-size:11px;margin-top:6px;color:#64748b">دخول: ${a.checkIn||'—'} · خروج: ${a.checkOut||'—'}</div>`:''}
    </div>`;
  };

  // قائمة المعلمات للفلترة (للإدارة فقط)
  const teachers=isAdmin?DB.users().filter(t=>t.role==='teacher'&&(!sid||t.schoolId===sid)):[];
  const teacherFilter=App.params.teacherFilter||'';
  const branchFilter=App.params.branchFilter||'';

  return `
  <div class="actions-bar" style="flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-weight:600;font-size:14px">التاريخ:</label>
      <input type="date" class="input" style="width:160px" value="${date}" onchange="App.go('attendance',{date:this.value,schoolId:'${sid||''}',branchFilter:'${branchFilter}',teacherFilter:'${teacherFilter}'})" max="${T0}">
    </div>
    <button class="btn btn-primary btn-sm" onclick="saveAttendance('${date}','${sid||''}')">💾 حفظ الحضور</button>
    <div style="margin-right:auto;display:flex;gap:8px">
      <span class="badge badge-green">✅ ${Object.values(attMap).filter(a=>a.status==='present').length} حاضر</span>
      <span class="badge badge-red">❌ ${Object.values(attMap).filter(a=>a.status==='absent').length} غائب</span>
      <span class="badge badge-yellow">⏰ ${Object.values(attMap).filter(a=>a.status==='late').length} متأخر</span>
    </div>
  </div>

  ${isAdmin?`
  <div class="card" style="padding:12px;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <span style="font-size:13px;font-weight:600;color:#64748b">🏢 الفرع:</span>
      <span class="chip ${!branchFilter?'active':''}" onclick="App.go('attendance',{date:'${date}',schoolId:'${sid||''}',branchFilter:'',teacherFilter:'${teacherFilter}'})">الكل</span>
      ${DB.branches().map(b=>`<span class="chip ${branchFilter===b.id?'active':''}" onclick="App.go('attendance',{date:'${date}',schoolId:'${sid||''}',branchFilter:'${b.id}',teacherFilter:'${teacherFilter}'})">${esc(b.name)}</span>`).join('')}
    </div>
    <div style="border-top:1px solid #f1f5f9;padding-top:10px">
      <span style="font-size:13px;font-weight:600;color:#64748b">👩‍🏫 الفصل:</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        <span class="chip ${!teacherFilter?'active':''}" onclick="App.go('attendance',{date:'${date}',schoolId:'${sid||''}',branchFilter:'${branchFilter}',teacherFilter:''})">جميع الفصول</span>
        ${teachers.map(t=>`<span class="chip ${teacherFilter===t.id?'active':''}" onclick="App.go('attendance',{date:'${date}',schoolId:'${sid||''}',branchFilter:'${branchFilter}',teacherFilter:'${t.id}'})">${esc(t.name)}</span>`).join('')}
      </div>
    </div>
  </div>`:''}

  ${kids.length===0?`<div class="card"><div class="empty-state"><div class="es-icon">👶</div><p>${isTeacher?'لا يوجد أطفال مسجلون في فرعك وفترتك':'لا يوجد أطفال مسجلون في هذا الفرع'}</p></div></div>`:`
  <div class="attendance-grid" id="att-grid">
    ${kids.map(c=>renderCard(c)).join('')}
  </div>`}
  `;
},

// ---------- REPORTS ----------
reports(){
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  let children=DB.children();
  let subs=DB.subscriptions();
  let attList=DB.attendance();
  if(sid){
    children=children.filter(c=>c.schoolId===sid);
    subs=subs.filter(s=>s.schoolId===sid);
    attList=attList.filter(a=>a.schoolId===sid);
  }
  if(bid){
    const branchChildIds=new Set(children.filter(c=>c.branchId===bid).map(c=>c.id));
    children=children.filter(c=>c.branchId===bid);
    subs=subs.filter(s=>branchChildIds.has(s.childId));
    attList=attList.filter(a=>branchChildIds.has(a.childId));
  }
  const totalRev=subs.reduce((a,s)=>a+s.paidAmount,0);
  const pendingRev=subs.reduce((a,s)=>a+(s.price-s.paidAmount),0);

// ---------- WHATSAPP ----------
whatsapp(){
  const sid=Auth.schoolId();
  const bid=Auth.branchId();
  const al=DB.alerts(sid,bid);
  let children=DB.children();
  let subs=DB.subscriptions();
  if(sid){children=children.filter(c=>c.schoolId===sid);subs=subs.filter(s=>s.schoolId===sid);}
  if(bid){children=children.filter(c=>c.branchId===bid);subs=subs.filter(s=>s.branchId===bid);}
  const buildMsg=(sub,days)=>{
    const c=children.find(x=>x.id===sub.childId);
    if(!c) return null;
    const msgs={
      expired:`السلام عليكم 🌟\nنود إشعاركم بأن اشتراك الطفل ${c.name} في مدارك الطفل قد انتهى بتاريخ ${formatDate(sub.endDate)}.\nيسعدنا التواصل معكم لتجديد الاشتراك.\nشكراً لثقتكم 🌺`,
      today:`السلام عليكم 🌟\nتذكير ودي: اشتراك ${c.name} ينتهي اليوم.\nلتجديد الاشتراك تواصلوا معنا.\nشكراً 🌺`,
      soon:`السلام عليكم 🌟\nتذكير: اشتراك ${c.name} سينتهي بتاريخ ${formatDate(sub.endDate)} (خلال ${days} أيام).\nيسعدنا خدمتكم لتجديد الاشتراك.\nشكراً 🌺`,
    };
    const msgKey=days===0?'today':days<0?'expired':'soon';
    const phone='966'+c.parentPhone.slice(1);
    return {child:c,sub,msg:msgs[msgKey],phone};
  };
  const renderGroup=(list,label,days)=>{
    const items=list.map(s=>buildMsg(s,days)).filter(Boolean);
    if(!items.length) return '';
    return `
    <div class="card">
      <div class="card-title">${label} (${items.length})</div>
      ${items.map(({child,sub,msg,phone})=>`
      <div style="border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:16px">

// ---------- MY REPORTS (Teacher) ----------
myReports(){
  const u=Auth.user;
  const sid=Auth.schoolId();
  // أطفال المعلمة فقط
  const kids=DB.children().filter(c=>c.schoolId===sid&&c.teacherId===u.id);
  const attList=DB.attendance().filter(a=>a.schoolId===sid);
  const allSubs=DB.subscriptions();
  return `
  <div class="print-cover">
    <h1>🌱 مدارك الطفل</h1>
    <p>تقرير حضور الأطفال — ${esc(Auth.user?.name||'')} — تاريخ الطباعة: ${formatDate(T0)}</p>
  </div>
  <div class="rpt-bar no-print">
    <span class="rpt-bar-title">📊 تقرير حضور أطفالي</span>
    <div class="rpt-bar-btns">
      <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ طباعة / PDF</button>
      <button class="btn btn-secondary btn-sm" onclick="exportTableCSV('rpt-teacher','تقرير-حضور')">📊 CSV</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📊 تقرير حضور أطفالي (${kids.length} طفل)</div>
    ${kids.length===0?`<div class="empty-state"><div class="es-icon">👶</div><p>لا يوجد أطفال مسندون إليك حتى الآن</p></div>`:`
    <table id="rpt-teacher">
      <thead><tr><th>الطفل</th><th>الفرع / الفترة</th><th>حالة الاشتراك</th><th>حضور</th><th>غياب</th><th>تأخر</th><th>نسبة</th></tr></thead>
      <tbody>
        ${kids.map(c=>{
          const cAtt=attList.filter(a=>a.childId===c.id);
          const present=cAtt.filter(a=>a.status==='present').length;
          const absent=cAtt.filter(a=>a.status==='absent').length;
          const late=cAtt.filter(a=>a.status==='late').length;
          const total=cAtt.length||1;
          const pct=Math.round((present+late)/total*100);
          const activeSub=allSubs.find(s=>s.childId===c.id&&s.isActive&&s.startDate<=T0&&s.endDate>=T0);
          const subStatus=activeSub?`<span class="badge badge-green" style="font-size:11px">✅ حتى ${formatDate(activeSub.endDate)}</span>`:`<span class="badge badge-red" style="font-size:11px">⛔ منتهي</span>`;
          return `<tr>
            <td><strong>${esc(c.name)}</strong><br><small style="color:#94a3b8">${esc(c.parentName)}</small></td>
            <td>
              <span class="badge badge-blue" style="font-size:10px">🏢 ${DB.branchName(c.branchId)}</span><br>
              <span class="badge ${c.period==='morning'?'badge-blue':'badge-orange'}" style="font-size:10px;margin-top:3px">${c.period==='morning'?'🌅 صباحي':'🌙 مسائي'}</span>
            </td>
            <td>${subStatus}</td>
            <td style="color:#10b981;font-weight:700">${present}</td>
            <td style="color:#ef4444;font-weight:700">${absent}</td>
            <td style="color:#f59e0b;font-weight:700">${late}</td>
            <td>
              <div style="display:flex;align-items:center;gap:6px">
                <div class="progress-bar" style="width:60px"><div class="progress-fill" style="width:${pct}%;background:${pct>80?'#10b981':pct>60?'#f59e0b':'#ef4444'}"></div></div>
                <span style="font-size:12px;font-weight:700">${pct}%</span>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  </div>`;
},

const SUB_PRICES={morning:{daily:150,weekly:600,monthly:1800},evening:{daily:70,weekly:300,monthly:900}};

function calcEndDate(recalcEnd=true){
  const type=document.getElementById('sub-type')?.value;
  const start=document.getElementById('sub-start')?.value;
  const end=document.getElementById('sub-end');
  const period=document.getElementById('sub-period')?.value||'evening';
  if(!type||!start||!end) return;
  if(recalcEnd){
    if(type==='daily') end.value=start;
    else if(type==='weekly') end.value=addDays(start,7);
    else if(type==='monthly') end.value=addDays(start,30);
  }
  const priceEl=document.getElementById('sub-price');
  const paidEl=document.getElementById('sub-paid');
  const baseLabel=document.getElementById('sub-base-label');
  const base=(SUB_PRICES[period]||SUB_PRICES.evening)[type]||0;
  const disc=parseFloat(document.getElementById('sub-disc')?.value||0);
  const final=disc>0?Math.round(base*(1-disc/100)):base;
  if(baseLabel) baseLabel.textContent=base+' ر.س';
  if(priceEl){priceEl.value=final;if(paidEl)paidEl.value=final;}
}

function calcChildSubPrice(recalcEnd=true){
  const type=document.getElementById('c-sub-type')?.value;
  const start=document.getElementById('c-sub-start')?.value;
  const period=document.getElementById('c-period')?.value||'evening';
  const endEl=document.getElementById('c-sub-end');
  if(recalcEnd&&type&&start&&endEl){
    if(type==='daily') endEl.value=start;
    else if(type==='weekly') endEl.value=addDays(start,7);
    else endEl.value=addDays(start,30);
  }
  const priceEl=document.getElementById('c-sub-price');
  const paidEl=document.getElementById('c-sub-paid');
  const hintEl=document.getElementById('c-base-hint');
  if(priceEl&&type){
    const base=(SUB_PRICES[period]||SUB_PRICES.evening)[type]||0;
    const disc=parseFloat(document.getElementById('c-disc')?.value||0);
    const final=disc>0?Math.round(base*(1-disc/100)):base;
    if(hintEl) hintEl.textContent=disc>0?`أصل: ${base} ر.س`:'';
    priceEl.value=final;
    if(paidEl) paidEl.value=final;
  }
}

function syncPaidAmount(srcId,tgtId){
  const src=document.getElementById(srcId);
  const tgt=document.getElementById(tgtId);

function setPM(btn,hiddenId){
  btn.parentElement.querySelectorAll('.pm-btn').forEach(b=>b.classList.remove('pm-active'));
  btn.classList.add('pm-active');
  const h=document.getElementById(hiddenId);
  if(h) h.value=btn.dataset.v;
}

function handleReceiptImg(input,hiddenId,previewId){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const h=document.getElementById(hiddenId);
    if(h) h.value=e.target.result;
    const p=document.getElementById(previewId);
    if(p){p.style.display='block';p.innerHTML=`<img src="${e.target.result}"><div style="font-size:11px;color:#10b981;margin-top:4px">✅ تم رفع الإيصال</div>`;}
  };
  reader.readAsDataURL(file);
}

function savePay(){
  const subId=document.getElementById('pay-sub')?.value;
  const amount=parseFloat(document.getElementById('pay-amount')?.value||0);
  const status=document.getElementById('pay-status')?.value;
  const sub=DB.subscriptions().find(s=>s.id===subId);
  if(!sub||amount<=0){alert('يرجى إدخال مبلغ صحيح');return}
  sub.paidAmount=Math.min(sub.price,sub.paidAmount+amount);
  sub.paymentStatus=sub.paidAmount>=sub.price?'paid':status;
  DB.updateSub(sub);
  App.closeModal();
  App.go('subscriptions');
}

function previewImport(input){
  const file = input.files[0];
  if(!file) return;
  const isCSV = file.name.toLowerCase().endsWith('.csv');
  const reader = new FileReader();
  reader.onload = function(e){
    let rows = [];
    try{
      if(isCSV){
        rows = _parseCSV(e.target.result);
      } else {
        if(typeof XLSX === 'undefined'){
          document.getElementById('import-preview').innerHTML='<div class="alert-box alert-red">⚠️ مكتبة Excel غير محملة، استخدم ملف CSV بدلاً</div>';
          return;
        }
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
      }
      _showImportPreview(rows);
    } catch(err){
      document.getElementById('import-preview').innerHTML=`<div class="alert-box alert-red">⚠️ خطأ في قراءة الملف: ${err.message}</div>`;
    }
  };
  if(isCSV) reader.readAsText(file, 'UTF-8');
  else reader.readAsArrayBuffer(file);
}

function _parseCSV(text){
  return text.split('\n').filter(l=>l.trim()).map(line=>{
    const row=[]; let q=false, cell='';
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){q=!q;}
      else if(ch===','&&!q){row.push(cell.trim());cell='';}
      else cell+=ch;
    }
    row.push(cell.trim());
    return row;
  });
}

function _showImportPreview(rows){
  const preview = document.getElementById('import-preview');
  const btn = document.getElementById('confirm-import-btn');
  if(!rows||rows.length<2){
    preview.innerHTML='<div class="alert-box alert-red">⚠️ الملف فارغ أو لا يحتوي على بيانات</div>';
    btn.style.display='none'; return;
  }
  _importRows = rows.slice(1)
    .map(r=>({
      name:String(r[0]||'').trim(),
      parentName:String(r[1]||'').trim(),
      parentPhone:String(r[2]||'').trim(),
      branchHint:String(r[3]||'').trim(),
      periodHint:String(r[4]||'').trim(),
      grade:String(r[5]||'').trim(),
      notes:String(r[6]||'').trim(),
    }))
    .filter(r=>r.name && !r.name.startsWith('مثال'));
  if(!_importRows.length){
    preview.innerHTML='<div class="alert-box alert-red">⚠️ لا توجد بيانات صالحة (تأكد من حذف سطر المثال)</div>';
    btn.style.display='none'; return;
  }
  preview.innerHTML=`
    <div class="alert-box alert-green" style="margin-bottom:12px">✅ تم قراءة <strong>${_importRows.length}</strong> سجل — راجع البيانات قبل الاستيراد</div>
    <div style="overflow-x:auto;max-height:240px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px">
    <table style="margin:0">
      <thead><tr><th>#</th><th>الاسم</th><th>ولي الأمر</th><th>الهاتف</th><th>الفرع</th><th>الفترة</th><th>المرحلة</th></tr></thead>
      <tbody>
        ${_importRows.map((r,i)=>`<tr>
          <td style="color:#94a3b8">${i+1}</td>
          <td><strong>${esc(r.name)}</strong></td>
          <td>${esc(r.parentName)||'—'}</td>
          <td>${esc(r.parentPhone)||'—'}</td>
          <td>${esc(r.branchHint)||'—'}</td>
          <td>${r.periodHint.includes('صباح')||r.periodHint.toLowerCase()==='morning'?'🌅 صباحية':'🌙 مسائية'}</td>
          <td>${esc(r.grade)||'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>`;
  btn.style.display='';
}

function uploadLogo(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      canvas.width=img.width; canvas.height=img.height;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      // إزالة الخلفية السوداء
      const data=ctx.getImageData(0,0,canvas.width,canvas.height);
      const px=data.data;
      for(let i=0;i<px.length;i+=4){
        const r=px[i],g=px[i+1],b=px[i+2];
        if(r<30&&g<30&&b<30) px[i+3]=0;
      }
      ctx.putImageData(data,0,0);
      const b64=canvas.toDataURL('image/png');
      localStorage.setItem('ccs_logo',b64);
      App.render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

      .join(',')

  a.href=url;a.download=(filename||'تقرير')+'.csv';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function exportAllData(){
  if(typeof XLSX==='undefined'){alert('مكتبة Excel غير محملة');return}
  const sid=Auth.schoolId();
  const allChildren=DB.children();
  const children=(sid?allChildren.filter(c=>c.schoolId===sid):allChildren);
  const subs=(sid?DB.subscriptions().filter(s=>s.schoolId===sid):DB.subscriptions());
  const att=(sid?DB.attendance().filter(a=>a.schoolId===sid):DB.attendance());
  const periodLabel=p=>p==='morning'?'صباحي':'مسائي';
  const subTypeLabel={'daily':'يومي','weekly':'أسبوعي','monthly':'شهري'};
  const attStatusLabel={'present':'حاضر','absent':'غائب','late':'متأخر'};
  const wb=XLSX.utils.book_new();

  // ورقة الأطفال
  const wsChildren=XLSX.utils.json_to_sheet(children.map(c=>({
    'الاسم':c.name,
    'اسم ولي الأمر':c.parentName,
    'هاتف ولي الأمر':c.parentPhone,
    'الفرع':DB.branchName(c.branchId),
    'الفترة':periodLabel(c.period),
    'المرحلة':c.grade||'',
    'تاريخ الانضمام':c.joinDate||'',
    'ملاحظات':c.notes||'',
  })));
  XLSX.utils.book_append_sheet(wb,wsChildren,'الأطفال');

  // ورقة الاشتراكات
  const wsSubs=XLSX.utils.json_to_sheet(subs.map(s=>{
    const child=allChildren.find(c=>c.id===s.childId);
    return {
      'اسم الطفل':child?.name||'',
      'النوع':subTypeLabel[s.type]||s.type,
      'الفترة':periodLabel(s.period),
      'من':s.startDate||'',
      'إلى':s.endDate||'',
      'السعر':s.price||0,
      'المدفوع':s.paidAmount||0,
      'المتبقي':(s.price||0)-(s.paidAmount||0),
      'رقم الفاتورة':s.invoiceNo||'',
    };
  }));
  XLSX.utils.book_append_sheet(wb,wsSubs,'الاشتراكات');

  // ورقة الحضور
  const wsAtt=XLSX.utils.json_to_sheet(att.map(a=>{
    const child=allChildren.find(c=>c.id===a.childId);
    return {
      'اسم الطفل':child?.name||'',
      'التاريخ':a.date||'',
      'الحالة':attStatusLabel[a.status]||a.status,
      'دخول':a.checkIn||'',
      'خروج':a.checkOut||'',
    };
  }));
  XLSX.utils.book_append_sheet(wb,wsAtt,'الحضور');

  const date=new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb,'مدارك-الطفل-'+date+'.xlsx');
}

// Attendance
const pendingAtt={};
function setAtt(childId,status,date,schoolId){
  if(!pendingAtt[date]) pendingAtt[date]={};
  pendingAtt[date][childId]={childId,status,date,schoolId,checkIn:'07:30',checkOut:'14:00',takenBy:Auth.user.id,notes:''};
  // Update UI immediately
  const card=document.getElementById('att-'+childId);
  if(card){
    card.className='attendance-card '+status;
    card.querySelectorAll('button').forEach((b,i)=>{
      const statuses=['present','absent','late'];
      b.className=`btn btn-xs ${status===statuses[i]?['btn-success','btn-danger','btn-warning'][i]:''}`;
    });
  }
}

function saveAttendance(date,schoolId){
  const att=DB.attendance();
  const entries=pendingAtt[date]||{};
  Object.values(entries).forEach(entry=>{
    const hadPrev=att.some(a=>a.childId===entry.childId);
    const idx=att.findIndex(a=>a.childId===entry.childId&&a.date===date);
    if(idx>=0) att[idx]={...att[idx],...entry};
    else att.push({id:uid(),...entry});
    if(!hadPrev&&entry.status==='present'){
      const child=DB.children().find(c=>c.id===entry.childId);
      if(child) DB.addNotification({type:'first_att',title:'🌟 أول حضور',body:`${child.name} حضر لأول مرة — ${DB.branchName(child.branchId)}`,addedBy:Auth.user.name});
    }
  });
  DB.saveAttendance(att);
  alert('✅ تم حفظ الحضور بنجاح');
}

function formatRelTime(iso){
  if(!iso) return '';
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000),h=Math.floor(diff/3600000),d=Math.floor(diff/86400000);
  if(m<1) return 'الآن';
  if(m<60) return `منذ ${m} دقيقة`;
  if(h<24) return `منذ ${h} ساعة`;
  if(d<7) return `منذ ${d} يوم`;
  return formatDate(iso.split('T')[0]);
}
function toggleNotifPanel(){
  const p=document.getElementById('notif-panel');
  if(!p) return;
  const open=p.style.display!=='none';
  p.style.display=open?'none':'block';

    setTimeout(()=>{
      document.addEventListener('click',function h(e){
        if(!p.contains(e.target)&&e.target.id!=='notif-btn'&&!e.target.closest('#notif-btn')){
          p.style.display='none';document.removeEventListener('click',h);
        }
      });

  }
}
